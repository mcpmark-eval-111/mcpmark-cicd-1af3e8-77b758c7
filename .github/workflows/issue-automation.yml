name: Issue Management Workflow

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write
  pull-requests: write
  metadata: read

jobs:
  issue-triage:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Auto-Triage Issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const title = (issue.title || '').toLowerCase();
            const body = (issue.body || '').toLowerCase();
            const text = title + ' ' + body;

            // Define labels to manage
            const labelsToCreate = [
              { name: 'bug', color: 'd73a4a', description: "Something isn't working" },
              { name: 'enhancement', color: 'a2eeef', description: 'New feature or request' },
              { name: 'epic', color: '3e82f7', description: 'Large feature requiring multiple sub-tasks' },
              { name: 'maintenance', color: '762bf2', description: 'Maintenance and housekeeping tasks' },
              { name: 'priority-critical', color: 'b60205', description: 'Critical priority issue' },
              { name: 'priority-high', color: 'd93f0b', description: 'High priority issue' },
              { name: 'priority-medium', color: 'fbca04', description: 'Medium priority issue' },
              { name: 'priority-low', color: '0e8a16', description: 'Low priority issue' },
              { name: 'needs-triage', color: 'fef2c0', description: 'Needs to be reviewed by maintainers' },
              { name: 'needs-review', color: 'd4c5f9', description: 'Awaiting review from maintainers' },
              { name: 'first-time-contributor', color: 'c2e0c6', description: 'Issue created by first-time contributor' }
            ];

            // Ensure all labels exist
            for (const label of labelsToCreate) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name
                });
              } catch (err) {
                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description
                  });
                } catch (createErr) {
                  console.log(`Label ${label.name} might have been created in parallel: ${createErr.message}`);
                }
              }
            }

            // Determine category labels based on title keywords
            const categoriesToAdd = [];
            if (title.includes('bug')) categoriesToAdd.push('bug');
            if (title.includes('epic')) categoriesToAdd.push('epic');
            if (title.includes('maintenance')) categoriesToAdd.push('maintenance');

            // Determine priority labels based on title OR body keywords
            let priority = 'priority-medium'; // default
            const hasCritical = ["critical", "urgent", "production", "outage"].some(kw => text.includes(kw));
            const hasHigh = ["important", "high", "blocking"].some(kw => text.includes(kw));
            const hasMedium = ["medium", "normal"].some(kw => text.includes(kw));
            const hasLow = ["low", "nice-to-have", "minor"].some(kw => text.includes(kw));

            if (hasCritical) {
              priority = 'priority-critical';
            } else if (hasHigh) {
              priority = 'priority-high';
            } else if (hasMedium) {
              priority = 'priority-medium';
            } else if (hasLow) {
              priority = 'priority-low';
            }

            // Prepare labels to add
            const labelsToAdd = ['needs-triage', priority, ...categoriesToAdd];

            console.log(`Adding labels to issue #${issue.number}:`, labelsToAdd);
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: labelsToAdd
            });

  task-breakdown:
    runs-on: ubuntu-latest
    needs: issue-triage
    permissions:
      issues: write
    steps:
      - name: Epic Task Breakdown
        uses: actions/github-script@v7
        with:
          script: |
            const { data: latestIssue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number
            });

            const title = latestIssue.title;
            const lowercaseTitle = title.toLowerCase();

            if (!lowercaseTitle.includes('epic')) {
              console.log('Not an Epic issue, skipping task breakdown.');
              return;
            }

            const body = latestIssue.body || '';
            if (body.includes('## Epic Tasks')) {
              console.log('Sub-tasks already created for this epic, skipping.');
              return;
            }

            const taskNames = [
              'Requirements Analysis',
              'Design and Architecture',
              'Implementation',
              'Testing and Documentation'
            ];

            console.log(`Creating 4 sub-issues for Epic #${latestIssue.number}...`);
            const subIssueNumbers = [];
            for (let i = 0; i < taskNames.length; i++) {
              const n = i + 1;
              const subtaskTitle = `[SUBTASK] ${title} - Task ${n}: ${taskNames[i]}`;
              const subtaskBody = `Related to #${latestIssue.number}`;
              
              const response = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: subtaskTitle,
                body: subtaskBody,
                labels: ['enhancement', 'needs-review']
              });
              subIssueNumbers.push({ number: response.data.number, name: taskNames[i] });
            }

            const checklist = [
              '\n\n## Epic Tasks',
              ...subIssueNumbers.map(sub => `- [ ] #${sub.number} ${sub.name}`)
            ].join('\n');

            console.log(`Updating Epic #${latestIssue.number} body with sub-task checklist.`);
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: latestIssue.number,
              body: body + checklist
            });

  auto-response:
    runs-on: ubuntu-latest
    needs: issue-triage
    permissions:
      issues: write
    steps:
      - name: Send Auto-Response
        uses: actions/github-script@v7
        with:
          script: |
            const { data: latestIssue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number
            });

            const author = latestIssue.user.login;

            // 1. Check if first issue in repository
            const response = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              creator: author,
              state: 'all',
              per_page: 100
            });

            const issuesCreated = response.data.filter(item => !item.pull_request);
            const isFirstIssue = issuesCreated.length <= 1;

            // 2. Avoid duplicate comments
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: latestIssue.number
            });

            const alreadyCommented = comments.data.some(c => 
              c.body.includes("Bug Report Guidelines") || 
              c.body.includes("Feature Request Process") || 
              c.body.includes("Maintenance Guidelines") ||
              c.body.includes("Welcome to the repository")
            );

            if (alreadyCommented) {
              console.log('Already responded to this issue, skipping.');
              return;
            }

            // 3. Prepare response comment
            let commentBody = '';
            const labels = latestIssue.labels.map(l => l.name);

            if (isFirstIssue) {
              commentBody += `Welcome to the repository, @${author}! Thank you for creating your first issue here. We appreciate your contribution!\n\n`;
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: latestIssue.number,
                  labels: ['first-time-contributor']
                });
              } catch (err) {
                console.log(`Failed to add first-time-contributor label: ${err.message}`);
              }
            }

            if (labels.includes('bug')) {
              commentBody += `### Bug Report Guidelines\nThank you for reporting this bug. Please ensure you have provided step-by-step reproduction instructions and expected vs actual behavior. Our team will review it shortly.`;
            } else if (labels.includes('epic')) {
              commentBody += `### Feature Request Process\nThis is an Epic issue. We will break down this epic into smaller sub-tasks. Please follow our Feature Request Process for tracking implementation progress.`;
            } else if (labels.includes('maintenance')) {
              commentBody += `### Maintenance Guidelines\nThis issue is categorized as maintenance. Please refer to our Maintenance Guidelines to ensure compliance with our code standards and refactoring practices.`;
            }

            if (commentBody) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: latestIssue.number,
                body: commentBody
              });
            }

            // 4. Sets milestone "v1.0.0" for priority-high and priority-critical issues
            if (labels.includes('priority-high') || labels.includes('priority-critical')) {
              // Check if v1.0.0 milestone exists
              const milestones = await github.rest.issues.listMilestones({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open'
              });
              let milestone = milestones.data.find(m => m.title === 'v1.0.0');
              if (!milestone) {
                try {
                  const createdMilestone = await github.rest.issues.createMilestone({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    title: 'v1.0.0',
                    description: 'Version 1.0.0 release'
                  });
                  milestone = createdMilestone.data;
                } catch (milestoneErr) {
                  console.log(`Milestone creation error (might exist already): ${milestoneErr.message}`);
                  // Fetch again to be sure
                  const updatedMilestones = await github.rest.issues.listMilestones({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    state: 'open'
                  });
                  milestone = updatedMilestones.data.find(m => m.title === 'v1.0.0');
                }
              }
              
              if (milestone) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: latestIssue.number,
                  milestone: milestone.number
                });
              }
            }

            // 5. Change status from needs-triage to needs-review
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: latestIssue.number,
                name: 'needs-triage'
              });
            } catch (err) {
              console.log('needs-triage label was not on the issue or already removed.');
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: latestIssue.number,
              labels: ['needs-review']
            });
